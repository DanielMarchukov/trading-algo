name: Build and Test Project

on:
  push:
    branches: ["mainline"]
  pull_request:
    branches: ["mainline"]

jobs:
  build-python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/Library/Caches/pip
            ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov websockets pyzmq msgpack
          pip install -r data-ingestion/requirements.txt

      - name: Lint with pyright
        run: pyright data-ingestion/src/

      - name: Test with pytest and coverage
        run: |
          pytest data-ingestion/src/ -v --cov=data-ingestion/src --cov-report=xml --cov-report=term
        env:
          APCA_API_KEY_ID: "DUMMY_KEY_FOR_TESTING"
          APCA_API_SECRET_KEY: "DUMMY_SECRET_FOR_TESTING"

      - name: Upload Python coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: python
          name: python-${{ matrix.os }}
          fail_ci_if_error: false
          verbose: true

  build-cpp:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            build_type: Debug
            vcpkg_triplet: x64-linux
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            build_type: Debug
            vcpkg_triplet: x64-linux
          - os: windows-latest
            build_type: Debug
            vcpkg_triplet: x64-windows-static
          - os: macos-latest
            build_type: Debug
            vcpkg_triplet: arm64-osx

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: ${{ runner.os }}-${{ matrix.build_type }}-${{ hashFiles('**/vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.build_type }}-

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Install build prerequisites (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autoconf-archive libtool pkg-config lcov llvm

      - name: Install build prerequisites (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install autoconf automake libtool pkg-config autoconf-archive
          echo "$(brew --prefix)/bin" >> $GITHUB_PATH

      - name: Set Compilers for macOS
        if: runner.os == 'macOS'
        run: |
          echo "CC=$(brew --prefix llvm@20)/bin/clang" >> $GITHUB_ENV
          echo "CXX=$(brew --prefix llvm@20)/bin/clang++" >> $GITHUB_ENV

      - name: Configure CMake
        if: runner.os != 'Windows'
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}/scripts/buildsystems/vcpkg.cmake
          -DENABLE_COVERAGE=ON
        env:
          CC: ${{ matrix.c_compiler }}
          CXX: ${{ matrix.cpp_compiler }}
        shell: bash

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -B build -S .
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }}
          -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake"
        shell: pwsh

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ./build
        run: ctest --build-config ${{ matrix.build_type }} --output-on-failure

      - name: Collect coverage (GCC on Linux)
        if: runner.os == 'Linux' && matrix.c_compiler == 'gcc'
        run: |
          cd build
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/vcpkg_installed/*' '*/tests/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Collect coverage (Clang)
        if: (runner.os == 'Linux' || runner.os == 'macOS') && matrix.cpp_compiler == 'clang++'
        run: |
          cd build
          llvm-profdata merge -sparse default.profraw -o default.profdata
          llvm-cov export ./rich_on_tests -instr-profile=default.profdata -format=lcov > coverage.info
          # Filter out system headers and test files
          lcov --remove coverage.info '/usr/*' '*/vcpkg_installed/*' '*/tests/*' --output-file coverage.info

      # Coverage collection for macOS with GCC (if using GCC)
      - name: Collect coverage (GCC on macOS)
        if: runner.os == 'macOS' && matrix.c_compiler == 'gcc'
        run: |
          cd build
          lcov --capture --directory . --output-file coverage.info
          lcov --remove coverage.info '/usr/*' '*/vcpkg_installed/*' '*/tests/*' '/opt/*' --output-file coverage.info
          lcov --list coverage.info

      - name: Upload C++ coverage to Codecov
        if: runner.os != 'Windows'
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./build/coverage.info
          flags: cpp
          name: cpp-${{ matrix.os }}-${{ matrix.cpp_compiler || 'default' }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload C++ Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trading-engine-${{ matrix.os }}-${{ matrix.cpp_compiler || 'msvc' }}-${{ matrix.build_type }}
          path: |
            build/hello
            build/Release/hello.exe
            build/Debug/hello.exe
          if-no-files-found: ignore

