codecov:
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 5%
    patch:
      default:
        target: 80%
        threshold: 5%

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach,diff,flags,files,footer"
  behavior: default
  require_changes: false

ignore:
  - "tests/"
  - "vcpkg_installed/"
  - "**/test_*.cpp"
  - "**/test_*.py"
  - "src/TradingEngine.cpp"
  - "src/ThreadPinning.cpp"
  - "src/AlpacaWebSocketSource.cpp"
  - "include/Utils.hpp"
  - "include/AlpacaMsgpackDecoder.hpp"
